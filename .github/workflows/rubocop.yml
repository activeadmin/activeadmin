name: Rubocop

on:
  pull_request:
permissions:
  contents: read


env:
  RUBY_VERSION: ${{ vars.RUBOCOP_RUBY_VERSION || '4.0' }}

jobs:
  rubocop:
    permissions:
      contents: read
      checks: write
      pull-requests: read
    name: Run rubocop
    runs-on: ubuntu-latest
    env:
      BUNDLE_ONLY: ${{ vars.RUBOCOP_BUNDLE_ONLY || 'rubocop' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed-files
        with:
          files: |
            .github/workflows/rubocop.yml
            .rubocop.yml
            **.rb
            **.rake
            **.arb
            bin/*
            gemfiles/**/Gemfile
            Gemfile*
            Rakefile
            *.gemspec
            .simplecov
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: reviewdog/action-rubocop@b6d5e953a5fc0bf3ab65254e77730ea2174d6d6d # v2.22.0
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          fail_level: any
          filter_mode: nofilter # added (default), diff_context, file, nofilter
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_install: true
          use_bundler: true
