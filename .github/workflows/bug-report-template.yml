name: Bug Reports

on:
  schedule:
    # Run every day at noon UTC
    - cron: '0 12 * * *'
  pull_request:
permissions:
  contents: read


concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUBY_VERSION: "4.0"

jobs:
  bug_report_template_test:
    permissions:
      contents: read
      pull-requests: read
    name: Run bug report template
    # Don't run scheduled workflow on forks
    if: ${{ (github.event_name == 'pull_request' || github.repository_owner == 'activeadmin') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed-files
        with:
          files: |
            app/**
            config/**
            lib/*.rb
            lib/active_admin/**
            tasks/bug_report_template.rb
            Gemfile*
            *.gemspec
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Run bug report template
        if: steps.changed-files.outputs.any_changed == 'true'
        run: ACTIVE_ADMIN_PATH=. ruby tasks/bug_report_template.rb
