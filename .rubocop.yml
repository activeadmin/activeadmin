---

inherit_mode:
  merge:
    - Include

plugins:
  - rubocop-capybara
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec

AllCops:
  DisabledByDefault: true
  TargetRubyVersion: 3.3
  TargetRailsVersion: 7.2

  Exclude:
    - .git/**/*
    - .github/**/*
    - bin/**/*
    - gemfiles/**/vendor/**/*
    - node_modules/**/*
    - tmp/**/*
    - vendor/**/*

  Include:
    - gemfiles/*/Gemfile
    - .simplecov

  DisplayCopNames: true

  StyleGuideCopsOnly: false

Bundler/DuplicatedGem:
  Enabled: true

Bundler/DuplicatedGroup:
  Enabled: true

# TODO: Gemfile relies on group headers, not per-gem comments; adding 70+ comments is churn. Keep disabled.
# Bundler/GemComment:
#   Enabled: false

Bundler/GemFilename:
  Enabled: true

# TODO: Main Gemfile deliberately leaves versions loose (pinned in gemfiles/*/Gemfile instead). Keep disabled.
# Bundler/GemVersion:
#   Enabled: false

Bundler/InsecureProtocolSource:
  Enabled: true

# TODO: Gemfile groups are alphabetized but ransack/formtastic etc. intentionally stuck together. Sort then enable.
# Bundler/OrderedGems:
#   Enabled: false

# TODO: Steps use generic click_on; splitting into click_link/click_button across feature steps is churn.
# Capybara/AmbiguousClick:
#   Enabled: false

